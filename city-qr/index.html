<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>City QR — A 3D Metropolis that Aligns into a Scannable QR Code</title>
  <meta name="description" content="Type any link and watch a 3D procedural skyline of skyscrapers seamlessly align into a functioning, scannable QR code. Built with Three.js.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏙️</text></svg>">
  <link rel="stylesheet" href="style.css">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">

  <!-- Vendor Libraries (100% local offline capable with CDN fallback) -->
  <script src="vendor/three.min.js"></script>
  <script src="vendor/OrbitControls.js"></script>
  <script src="vendor/qrcode.min.js"></script>
</head>
<body>

  <!-- Fullscreen 3D WebGL Canvas -->
  <div id="canvas-container"></div>

  <!-- Cybernetic Scanner HUD (Visible when aligned in QR mode) -->
  <div id="scanner-hud" class="scanner-hud">
    <div class="hud-corner tl"></div>
    <div class="hud-corner tr"></div>
    <div class="hud-corner bl"></div>
    <div class="hud-corner br"></div>
  </div>

  <!-- Top-Left Brand Header -->
  <header class="brand-header">
    <div class="brand-row">
      <a href="../index.html" class="back-link" title="Return to Engineering Portfolio">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
        <span>Portfolio</span>
      </a>
      <span class="brand-badge">Three.js 3D</span>
    </div>
    <div class="brand-title">
      <h1>City QR</h1>
    </div>
    <p class="brand-subtitle">
      A procedural 3D metropolis of skyscrapers that smoothly aligns into a scannable barcode.
    </p>
  </header>

  <!-- Mobile Toggle Button -->
  <button id="mobile-toggle" class="mobile-toggle-btn" aria-label="Toggle Control Panel">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
  </button>

  <!-- Floating Control Panel (Top Right) -->
  <aside id="control-panel" class="control-panel">
    <!-- URL Input -->
    <div class="panel-section">
      <div class="section-label">
        <span>Link to Encode</span>
        <span style="font-family: var(--font-mono); font-size: 0.68rem; color: var(--accent-cyan);">Live Sync</span>
      </div>
      <div class="input-row">
        <input type="text" id="inp-url" class="url-input" placeholder="https://your-link.com" spellcheck="false" autocomplete="off">
        <button id="btn-clear" class="input-clear-btn" title="Clear URL">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
        </button>
      </div>

      <!-- Quick Preset Pills -->
      <div class="presets-row">
        <button class="pill-btn preset-btn active" data-url="https://xallace.github.io/">Portfolio</button>
        <button class="pill-btn preset-btn" data-url="https://github.com/xallace">GitHub</button>
        <button class="pill-btn preset-btn" data-url="https://en.wikipedia.org/wiki/Skyscraper">Wikipedia</button>
        <button class="pill-btn preset-btn" data-url="https://www.typingmind.com/">TypingMind</button>
      </div>
    </div>

    <!-- Architectural Style -->
    <div class="panel-section">
      <div class="section-label">
        <span>Architecture Style</span>
      </div>
      <div class="styles-grid">
        <button class="style-card-btn style-btn active" data-style="metropolis">
          <span class="emoji">🏙️</span>
          <span>Metropolis</span>
        </button>
        <button class="style-card-btn style-btn" data-style="cyberpunk">
          <span class="emoji">🌆</span>
          <span>Cyberpunk</span>
        </button>
        <button class="style-card-btn style-btn" data-style="artdeco">
          <span class="emoji">🏛️</span>
          <span>Art Deco</span>
        </button>
        <button class="style-card-btn style-btn" data-style="voxel">
          <span class="emoji">📐</span>
          <span>Voxel City</span>
        </button>
        <button class="style-card-btn style-btn" data-style="scifi">
          <span class="emoji">🛸</span>
          <span>Sci-Fi</span>
        </button>
      </div>
    </div>

    <!-- Atmosphere / Lighting Palettes -->
    <div class="panel-section">
      <div class="section-label">
        <span>Lighting Atmosphere</span>
      </div>
      <div class="palettes-row">
        <button class="palette-btn active" data-palette="midnight">
          <span class="palette-swatch" style="background-color: #00f0ff;"></span>
          <span>Midnight</span>
        </button>
        <button class="palette-btn" data-palette="sunset">
          <span class="palette-swatch" style="background-color: #f59e0b;"></span>
          <span>Sunset</span>
        </button>
        <button class="palette-btn" data-palette="daylight">
          <span class="palette-swatch" style="background-color: #0284c7;"></span>
          <span>Daylight</span>
        </button>
        <button class="palette-btn" data-palette="matrix">
          <span class="palette-swatch" style="background-color: #22c55e;"></span>
          <span>Matrix</span>
        </button>
        <button class="palette-btn" data-palette="synthwave">
          <span class="palette-swatch" style="background-color: #d946ef;"></span>
          <span>Synthwave</span>
        </button>
        <button class="palette-btn" data-palette="blueprint">
          <span class="palette-swatch" style="background-color: #38bdf8;"></span>
          <span>Blueprint</span>
        </button>
      </div>
    </div>

    <!-- Action Buttons -->
    <div class="action-grid">
      <button id="btn-toggle-view" class="action-btn primary" title="Align camera and rooftops into a scannable QR code">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>
        <span>Align to Scannable QR</span>
      </button>

      <button id="btn-copy-link" class="action-btn" title="Copy shareable link with current configuration">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7l-1.7 1.7M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7l1.7-1.7"></path></svg>
        <span>Copy Link</span>
      </button>

      <button id="btn-download" class="action-btn" title="Download high-resolution PNG image">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"></path></svg>
        <span>Download PNG</span>
      </button>
    </div>
  </aside>

  <!-- Bottom Center Floating Hint Bar -->
  <div id="floating-hint" class="floating-hint-bar" title="Click to toggle between 3D Skyline and Scannable QR Code">
    <div id="hint-icon-svg" class="hint-icon">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
    </div>
    <div style="display: flex; flex-direction: column;">
      <span id="hint-text-main" class="hint-text">🏙️ Tap city to align into scannable QR</span>
      <span id="hint-text-sub" class="hint-sub">Or drag to orbit 3D view</span>
    </div>
  </div>

  <!-- Toast Notification -->
  <div id="toast-notice" class="toast-notice">✅ Link copied to clipboard!</div>

  <!-- App Script (ES Module) -->
  <script type="module" src="app.js"></script>
</body>
</html>
